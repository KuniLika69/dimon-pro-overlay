<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Dimon PRO Overlay</title>
<style>
  /* ===== ВАРИАНТ 2: дельфин (старое шоу) ===== */
  :root { --green: #00ff66; --gold: #ffd54a; }
  #term { font-family: "Consolas", "Courier New", monospace; }
  /* ---------- 1. ХАКЕР ---------- */
  #hack { background: #000; }
  #rain { position: absolute; inset: 0; width: 100%; height: 100%; }
  #term {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: min(80vw, 1100px);
    background: rgba(0, 10, 0, .85);
    border: 2px solid var(--green);
    box-shadow: 0 0 40px rgba(0,255,102,.5), inset 0 0 30px rgba(0,255,102,.15);
    padding: 2.2vh 2.5vw;
    color: var(--green);
    font-size: clamp(16px, 2.6vw, 44px);
    line-height: 1.35;
    text-shadow: 0 0 8px var(--green);
    min-height: 30vh;
    white-space: pre-wrap;
  }
  #term .hdr { font-size: .5em; opacity: .7; margin-bottom: 1vh; }
  #term .red { color: #ff3355; text-shadow: 0 0 10px #ff3355; }
  #term .gold { color: var(--gold); text-shadow: 0 0 12px var(--gold); }
  .cursor { display: inline-block; width: .6em; background: var(--green); animation: blink .6s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  #hack.glitch { animation: glitch .12s steps(2) 3; }
  @keyframes glitch {
    0% { transform: translate(0,0); filter: hue-rotate(0); }
    50% { transform: translate(-8px, 4px); filter: hue-rotate(90deg); }
    100% { transform: translate(6px,-3px); filter: hue-rotate(-60deg); }
  }

  /* ---------- 2. ДОЛЛАРОВЫЙ ДЕЛЬФИН ---------- */
  #sea {
    background: linear-gradient(#020b06 0%, #04311a 55%, #0a4d2a 100%);
  }
  #moneyrain { position: absolute; inset: 0; width: 100%; height: 100%; }
  #waves { position: absolute; left: 0; bottom: 0; width: 100%; height: 32vh; }
  #dolphin {
    position: absolute; left: 0; top: 0;
    width: 34vw; height: auto;
    transform-origin: 50% 50%;
    filter: drop-shadow(0 0 18px rgba(255,213,74,.7));
    will-change: transform;
  }
  .bill {
    position: absolute; font-weight: 900; color: var(--gold);
    text-shadow: 0 0 10px #ffb300, 0 0 2px #000;
    pointer-events: none; will-change: transform, opacity;
  }
  #seaTitle {
    position: absolute; top: 6vh; width: 100%; text-align: center;
    color: var(--gold); font-weight: 900;
    font-size: clamp(22px, 4vw, 70px);
    font-family: Impact, "Arial Black", sans-serif; letter-spacing: .05em;
    text-shadow: 0 0 20px #ffb300, 3px 3px 0 #000;
  }

  /* ---------- 3. PRO ---------- */
  #pro {
    background: radial-gradient(circle at 50% 45%, #2a1f00 0%, #0b0700 55%, #000 100%);
    display: none; align-items: center; justify-content: center; flex-direction: column;
    text-align: center;
  }
  #pro.on { display: flex; }
  #proWord {
    font-family: Impact, "Arial Black", sans-serif;
    font-size: clamp(120px, 26vw, 520px);
    line-height: .9;
    background: linear-gradient(180deg, #fff6c2 0%, #ffd54a 40%, #c78a00 70%, #fff1a1 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 40px rgba(255,200,0,.75)) drop-shadow(6px 8px 0 #000);
    animation: slam .6s cubic-bezier(.2,1.6,.4,1) both;
  }
  #proSub {
    margin-top: 3vh;
    font-family: Impact, "Arial Black", sans-serif;
    color: #fff; font-size: clamp(26px, 5.2vw, 100px);
    text-shadow: 0 0 18px var(--gold), 4px 4px 0 #000;
    opacity: 0; animation: rise .5s .55s ease-out forwards, shake .25s 1.2s 6;
  }
  #proSub b { color: var(--gold); }
  @keyframes slam { 0% { transform: scale(4) rotate(-12deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
  @keyframes rise { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes shake { 0%,100% { translate: 0 0; } 25% { translate: -6px 3px; } 75% { translate: 6px -3px; } }
  .shine {
    position: absolute; inset: 0; pointer-events: none;
    background: repeating-conic-gradient(from 0deg at 50% 45%, rgba(255,213,74,.10) 0 8deg, transparent 8deg 20deg);
    animation: spin 12s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* ===== основное ===== */
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    background: transparent; /* прозрачно — стрим видно */
    font-family: Impact, "Arial Black", sans-serif;
  }
  #stage { position: fixed; inset: 0; opacity: 0; pointer-events: none; transition: opacity .4s ease; }
  #stage.on { opacity: 1; }
  .phase { position: absolute; inset: 0; display: none; }
  .phase.on { display: block; }

  /* сцена с Димоном — прозрачный фон */
  #story svg { width: 100%; height: 100%; display: block; }
  #bubText { font-family: "Comic Sans MS", "Segoe UI", Arial, sans-serif; font-weight: 900; }

  /* надпись на весь экран */
  #txt {
    background: radial-gradient(circle at 50% 45%, rgba(40,28,0,.96), rgba(0,0,0,.97) 70%);
    text-align: center; color: #fff;
  }
  #txt.on { display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .t1 {
    font-size: clamp(70px, 14vw, 300px); line-height: .95;
    background: linear-gradient(180deg, #fff6c2, #ffd54a 45%, #c78a00 75%, #fff1a1);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 35px rgba(255,200,0,.8)) drop-shadow(6px 8px 0 #000);
    animation: slam .55s cubic-bezier(.2,1.6,.4,1) both;
  }
  .t2 { font-size: clamp(30px, 5.5vw, 115px); margin-top: 2vh; text-shadow: 4px 4px 0 #000; opacity: 0; animation: rise .45s .7s ease-out forwards; }
  .t3 { font-size: clamp(60px, 10vw, 210px); color: #ff3b3b; text-shadow: 0 0 25px #ff0000, 5px 5px 0 #000; opacity: 0; animation: pop .4s 1.5s cubic-bezier(.2,1.8,.4,1) forwards, wob .2s 1.9s 8; }
  .t4 { font-size: clamp(26px, 4.4vw, 95px); color: #7dffb0; margin-top: 1.5vh; text-shadow: 0 0 20px #00ff88, 4px 4px 0 #000; opacity: 0; animation: rise .45s 2.4s ease-out forwards; }
  @keyframes slam { 0% { transform: scale(4) rotate(-10deg); opacity: 0; } 100% { transform: none; opacity: 1; } }
  @keyframes rise { from { transform: translateY(50px); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes pop  { from { transform: scale(0) rotate(-30deg); opacity: 0; } to { transform: scale(1) rotate(-6deg); opacity: 1; } }
  @keyframes wob  { 50% { translate: 0 -10px; } }

  /* GPT с крыльями */
  #dsWings { background: linear-gradient(#6ec6ff, #e3f6ff); overflow: hidden; }
  .wg { position: absolute; font: clamp(28px, 4.2vw, 90px) Impact, sans-serif; color: #fff; text-shadow: 0 0 16px #ffd54a, 3px 3px 0 #b8860b;
        display: flex; align-items: center; animation: flyup linear infinite; }
  .wg i { display: block; width: 1.3em; height: .7em; background: #fff; border: 3px solid #cfd8dc; border-radius: 100% 0 100% 0; animation: flap .25s ease-in-out infinite alternate; }
  .wg i:first-child { transform-origin: right center; border-radius: 0 100% 0 100%; }
  .wg i:last-child { transform-origin: left center; }
  @keyframes flap { from { transform: rotate(25deg) scaleY(.6); } to { transform: rotate(-25deg) scaleY(1.1); } }
  .wg i:last-child { animation-name: flapR; }
  @keyframes flapR { from { transform: rotate(-25deg) scaleY(.6); } to { transform: rotate(25deg) scaleY(1.1); } }
  @keyframes flyup { from { transform: translateY(110vh) rotate(-6deg); } to { transform: translateY(-30vh) rotate(6deg); } }
  #wgTitle { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; font: clamp(50px, 9vw, 190px)/1 Impact, sans-serif;
             color: #fff; text-shadow: 0 0 30px #ffd54a, 6px 6px 0 #b8860b; animation: slam .6s cubic-bezier(.2,1.6,.4,1) both; z-index: 2; }

  /* Димвроди: телефон и финал */
  #mmPhone { background: rgba(8,8,14,.94); }
  #mmPhone.on { display: flex; align-items: center; justify-content: center; }
  .ph { width: min(46vh, 90vw); height: 90vh; background: #0f1218; border: 10px solid #222; border-radius: 48px; box-shadow: 0 0 0 4px #555, 0 0 60px rgba(255,47,109,.4); display: flex; flex-direction: column; overflow: hidden; font-family: "Segoe UI", Arial, sans-serif; }
  .phTop { display: flex; gap: 1.4vh; align-items: center; padding: 3.5vh 2vh 1.5vh; background: #1b1f2a; }
  .phAva { width: 6vh; height: 6vh; border-radius: 50%; background: #ff2f6d; display: grid; place-items: center; font-size: 3.6vh; }
  .phName { color: #fff; font-weight: 800; font-size: 2.6vh; }
  .phSt { color: #8bc34a; font-size: 1.7vh; }
  #phBody { flex: 1; padding: 2vh 1.6vh; display: flex; flex-direction: column; gap: 1.4vh; justify-content: flex-end; overflow: hidden; }
  .pm { max-width: 82%; padding: 1.2vh 1.6vh; border-radius: 2.2vh; font-size: 2.1vh; line-height: 1.3; color: #fff; animation: rise .25s ease-out; }
  .pm.k { align-self: flex-start; background: #3a1f2b; border: 2px solid #ff2f6d; border-bottom-left-radius: .5vh; }
  .pm.d { align-self: flex-end; background: #2f6fed; border-bottom-right-radius: .5vh; }
  #mmEnd { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; background: radial-gradient(circle, rgba(40,25,0,.95), rgba(0,0,0,.97) 70%); opacity: 0; transition: opacity .3s; font-family: Impact, sans-serif; }
  #mmEnd.on { opacity: 1; }
  #mmEnd .m1 { font-size: clamp(90px, 18vw, 380px); line-height: .9; background: linear-gradient(180deg, #fff6c2, #ffd54a 45%, #c78a00 75%, #fff1a1); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(6px 8px 0 #000) drop-shadow(0 0 30px rgba(255,200,0,.7)); }
  #mmEnd .m2 { color: #fff; font-size: clamp(30px, 5vw, 105px); text-shadow: 4px 4px 0 #000; }
  #mmEnd .m3 { color: #7dffb0; font-size: clamp(22px, 3.4vw, 72px); margin-top: 2vh; text-shadow: 3px 3px 0 #000, 0 0 18px #00ff88; }
  #mmEnd.on .m1 { animation: slam .55s cubic-bezier(.2,1.6,.4,1) both; }
  #mmEnd.on .m2 { animation: rise .4s .5s both; }
  #mmEnd.on .m3 { animation: rise .4s 1.1s both; }

  /* 2077: финальное сердце */
  #cyLove { background: radial-gradient(circle at 50% 50%, rgba(80,0,50,.95), rgba(0,0,0,.97) 70%); overflow: hidden; }
  #cyLove.on { display: flex; align-items: center; justify-content: center; }
  .lvHeart { position: absolute; font-size: min(95vh, 95vw); line-height: 1; color: #ff2f6d; filter: drop-shadow(0 0 60px #ff2f92); animation: beat .7s ease-in-out infinite; }
  @keyframes beat { 0%,100% { transform: scale(.9); } 30% { transform: scale(1.05); } 60% { transform: scale(.95); } }
  .lvText { position: relative; text-align: center; font-family: Impact, sans-serif; animation: slam .6s cubic-bezier(.2,1.6,.4,1) both; }
  .lv1 { font-size: clamp(60px, 12vw, 250px); color: #fff; text-shadow: 6px 6px 0 #000, 0 0 30px #fff; }
  .lv2 { font-size: clamp(26px, 4.6vw, 100px); color: #ffe066; text-shadow: 4px 4px 0 #000, 0 0 20px #ffb300; }

  /* ёлка: чат, разработка, слова */
  #xChat { background: rgba(10,12,18,.96); }
  #xChat.on { display: flex; align-items: center; justify-content: center; }
  .cw { width: min(86vw, 1300px); height: 78vh; background: #171a21; border: 3px solid #10a37f; border-radius: 22px; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 0 60px rgba(16,163,127,.5); font-family: "Segoe UI", Arial, sans-serif; }
  .cwHead { padding: 2vh 2vw; font: 900 clamp(22px, 2.6vw, 50px) Impact, sans-serif; color: #ffd54a; border-bottom: 2px solid #2a2f3a; }
  .cwHead span { font: 600 .45em "Segoe UI", Arial; color: #4caf50; margin-left: 1vw; }
  #cwBody { flex: 1; padding: 2vh 2vw; display: flex; flex-direction: column; gap: 2vh; }
  .msg { max-width: 75%; padding: 1.6vh 1.6vw; border-radius: 18px; font-size: clamp(18px, 2.3vw, 44px); line-height: 1.25; color: #fff; animation: rise .3s ease-out; }
  .msg.me { align-self: flex-end; background: #2f6fed; }
  .msg.bot { align-self: flex-start; background: #2a2f3a; border: 2px solid #10a37f; }
  .cwInput { margin: 0 2vw 2vh; padding: 1.6vh 1.4vw; background: #232733; border-radius: 14px; color: #fff; font-size: clamp(16px, 2vw, 38px); min-height: 1.3em; }
  .cwCaret { color: #10a37f; animation: blink .6s steps(1) infinite; }
  #xDev { background: #020a04; overflow: hidden; }
  #xDevCode { position: absolute; inset: 0; padding: 2vh 2vw; font: 600 clamp(12px, 1.4vw, 26px)/1.3 Consolas, monospace; color: #00ff66; white-space: pre; opacity: .8; }
  #xDevBox { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: min(80vw, 1200px); background: rgba(0,0,0,.85); border: 3px solid #ffd54a; border-radius: 20px; padding: 3vh 3vw; text-align: center; box-shadow: 0 0 50px rgba(255,213,74,.6); }
  #xDevTitle { font: clamp(34px, 6vw, 120px) Impact, sans-serif; color: #ffd54a; animation: wob .15s infinite; text-shadow: 0 0 20px #ffb300; }
  #xDevLabel { color: #fff; font: 700 clamp(16px, 2.1vw, 40px) "Segoe UI", Arial; margin: 2vh 0 1.5vh; }
  .bar { height: 3.5vh; background: #222; border-radius: 99px; overflow: hidden; border: 2px solid #555; }
  #xDevBar { height: 100%; width: 0; background: linear-gradient(90deg, #10a37f, #ffd54a); }
  #xWords { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .xw { position: absolute; font: clamp(26px, 4vw, 80px) Impact, sans-serif; animation: hop .6s ease-in-out infinite alternate; text-shadow: 3px 3px 0 #000, 0 0 18px currentColor; }
  @keyframes hop { from { transform: translateY(0) rotate(-8deg) scale(.9); } to { transform: translateY(-40px) rotate(8deg) scale(1.15); } }

  /* Вегас: крутые буквы */
  #vgText { background: radial-gradient(circle at 50% 50%, rgba(30,20,0,.95), rgba(0,0,0,.97) 70%); }
  #vgText.on { display: flex; align-items: center; justify-content: center; }
  #vgLines { text-align: center; }
  .vgl { font-size: clamp(36px, 6.4vw, 130px); line-height: 1.12; color: #fff; text-shadow: 5px 5px 0 #000; white-space: nowrap; }
  .vgl.gold { text-shadow: none; filter: drop-shadow(4px 4px 0 #000) drop-shadow(0 0 18px rgba(255,200,0,.6)); }
  .vgl.gold span { background: linear-gradient(180deg, #fff6c2, #ffd54a 45%, #c78a00 75%, #fff1a1); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .vgl.big { font-size: clamp(60px, 11vw, 230px); filter: drop-shadow(5px 5px 0 #000) drop-shadow(0 0 30px rgba(255,200,0,.8)); }
  .vgl span { display: inline-block; opacity: 0; animation: drop .45s cubic-bezier(.2,1.7,.4,1) forwards; }
  @keyframes drop { from { transform: translateY(-120px) rotate(-25deg) scale(2); opacity: 0; } to { transform: none; opacity: 1; } }

  /* кафе: финальная надпись */
  #cafeEnd {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center;
    background: radial-gradient(circle at 50% 50%, rgba(60,20,90,.95), rgba(0,0,0,.96) 70%);
    color: #fff; font-size: clamp(50px, 9vw, 190px); line-height: 1.05; text-shadow: 6px 6px 0 #000;
    opacity: 0; transform: scale(1.4); transition: opacity .35s, transform .45s cubic-bezier(.2,1.5,.4,1);
  }
  #cafeEnd.on { opacity: 1; transform: none; }
  #cafeEnd span {
    background: linear-gradient(180deg, #fff6c2, #ffd54a 45%, #c78a00 75%, #fff1a1);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 0 30px rgba(255,200,0,.8)); font-size: 1.3em;
  }

  /* tower defense */
  #td canvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<!-- общие градиенты/фильтры (всегда видимый svg, чтобы работали во всех сценах) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3a8"/><stop offset=".45" stop-color="#ffcc33"/>
      <stop offset=".75" stop-color="#c98a00"/><stop offset="1" stop-color="#fff0a0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3e9ef"/><stop offset=".5" stop-color="#8d99a6"/><stop offset="1" stop-color="#c7d0d9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
</svg>
<div id="stage">

  <!-- ===== ВАРИАНТ 2: хакер, дельфин, PRO ===== -->
  <!-- 1 -->
  <div class="phase" id="hack">
    <canvas id="rain"></canvas>
    <div id="term"></div>
  </div>
  <!-- 2 -->
  <div class="phase" id="sea">
    <canvas id="moneyrain"></canvas>
    <div id="seaTitle">$$$ ДЕНЬГИ НЕ ВАЖНЫ, ВАЖЕН PRO $$$</div>
    <svg id="waves" viewBox="0 0 1000 300" preserveAspectRatio="none">
      <defs>
        <linearGradient id="wg" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#1fbf5f"/>
          <stop offset="1" stop-color="#05331a"/>
        </linearGradient>
      </defs>
      <path id="wave1" fill="url(#wg)" opacity=".9"/>
      <path id="wave2" fill="#0d5f31" opacity=".95"/>
    </svg>
    <svg id="dolphin" viewBox="0 0 200 90">
      <defs>
        <pattern id="cash" width="9" height="11" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
          <rect width="9" height="11" fill="#1d7a3a"/>
          <text x="1.5" y="9" font-size="10" font-weight="900" font-family="Arial" fill="#ffe27a">$</text>
        </pattern>
      </defs>
      <!-- плавник -->
      <path d="M98 28 C103 16 111 8 124 4 C119 14 119 23 124 32 Z" fill="url(#cash)" stroke="#ffd54a" stroke-width="1.6"/>
      <!-- тело -->
      <path d="M20 52 C40 32 90 24 140 33 C156 36 166 41 173 45 L194 47 C197 49 195 52 190 52 L171 54
               C160 60 140 65 112 65 C102 71 94 77 86 80 C89 72 91 68 89 64
               C70 62 52 60 36 59 L24 71 C19 74 14 72 16 67 L19 58 L6 53 C3 49 8 46 12 48 Z"
            fill="url(#cash)" stroke="#ffd54a" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- глаз и улыбка -->
      <circle cx="160" cy="42" r="2.6" fill="#000"/><circle cx="160.8" cy="41.2" r=".9" fill="#fff"/>
      <path d="M176 50 Q182 53 188 51" stroke="#000" stroke-width="1.2" fill="none"/>
      <!-- очки PRO -->
      <rect x="152" y="38" width="13" height="7" rx="2" fill="#000" opacity=".85"/>
      <text x="153.5" y="44" font-size="5" font-weight="900" fill="#ffd54a" font-family="Arial">PRO</text>
    </svg>
  </div>
  <!-- 3 -->
  <div class="phase" id="pro">
    <div class="shine"></div>
    <div id="proWord">PRO</div>
    <div id="proSub">Я СТАЛ <b>ПРОФИ</b>. А ТЫ?</div>
  </div>

  <!-- ===== СЦЕНА 1–2: Димон, качок, ноут ===== -->
  <div class="phase" id="story">
    <svg viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff3a8"/><stop offset=".45" stop-color="#ffcc33"/>
          <stop offset=".75" stop-color="#c98a00"/><stop offset="1" stop-color="#fff0a0"/>
        </linearGradient>
        <radialGradient id="aura"><stop offset="0" stop-color="#4dff9a" stop-opacity=".55"/><stop offset="1" stop-color="#4dff9a" stop-opacity="0"/></radialGradient>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>

      <g id="world">
        <!-- ДИМОН -->
        <g id="dima" transform="translate(560,0)">
          <ellipse cx="0" cy="1000" rx="230" ry="22" fill="#000" opacity=".3"/>
          <!-- лучи и искры от ноута (после апгрейда) -->
          <g id="rays" transform="translate(0,866)" opacity="0"></g>
          <!-- ноги лотосом -->
          <path d="M-205 990 C-205 915 -60 895 0 935 C60 895 205 915 205 990 C120 1018 -120 1018 -205 990Z" fill="#2d3a4f" stroke="#111" stroke-width="5"/>
          <ellipse cx="-95" cy="972" rx="34" ry="16" fill="#f1c39b" stroke="#111" stroke-width="4"/>
          <ellipse cx="95" cy="972" rx="34" ry="16" fill="#f1c39b" stroke="#111" stroke-width="4"/>
          <!-- тело -->
          <path d="M-95 950 L-112 790 Q-100 728 0 724 Q100 728 112 790 L95 950 Z" fill="#3d7be0" stroke="#111" stroke-width="5"/>

          <circle cx="0" cy="-480" r="62" fill="#f1c39b" stroke="#111" stroke-width="5"/>

          <circle cx="-22" cy="-484" r="11" fill="#fff" stroke="#111" stroke-width="3"/><circle cx="22" cy="-484" r="11" fill="#fff" stroke="#111" stroke-width="3"/>
          <circle cx="-22" cy="-484" r="5" fill="#111"/><circle cx="22" cy="-484" r="5" fill="#111"/>
          <path d="M-20 -446 Q-6 -454 6 -446 Q14 -440 22 -448" stroke="#111" stroke-width="5" fill="none" stroke-linecap="round"/>

          <rect x="1176" y="320" width="80" height="20" fill="#fff"/>

<script>
/* ======================= НАСТРОЙКИ ======================= */
const EVERY_MS = 60000; // новый вариант каждую минуту
const FIRST_MS = 60000; // первое шоу через минуту после загрузки
const STORY_MS = 16500; // Димон + качок
const TEXT_MS  = 5500;  // "Димон PRO, а ты всё ещё гуглишь?"
const TD_MS    = 13000; // tower defense

const THOUGHTS = [
  [800,  "Plus или Pro?.."],
  [2400, "Хммммм..."],
  [3900, "7 раз отмерь..."],
  [5300, "РЕЖУУУУУУУУУУУ!"],
  [6700, "...а нет, ещё подумаю"],
  [8300, null],
  [9300, "О_о кто это?!"],
  [11000, null],
  [12900, "ЧТООО?! НОУТ СТАЛ PRO!"],
];
/* ========================================================= */

const $ = id => document.getElementById(id);
const stage = $("stage");
const sleep = ms => new Promise(r => setTimeout(r, ms));
const show = id => document.querySelectorAll(".phase").forEach(p => p.classList.toggle("on", p.id === id));
const lerp = (a, b, k) => a + (b - a) * k;
const clamp01 = k => Math.max(0, Math.min(1, k));
const anim = (ms, fn) => new Promise(res => {
  const t0 = performance.now();
  (function f(now) { const t = now - t0; fn(Math.min(t, ms)); t < ms ? requestAnimationFrame(f) : res(); })(t0);
});
const SVGNS = "http://www.w3.org/2000/svg";

/* ---------- лучи и искры (создаём один раз) ---------- */
for (let i = 0; i < 14; i++) {
  const p = document.createElementNS(SVGNS, "polygon");
  const a = i / 14 * Math.PI * 2, w = 0.11;
  p.setAttribute("points", `0,0 ${Math.cos(a - w) * 520},${Math.sin(a - w) * 520} ${Math.cos(a + w) * 520},${Math.sin(a + w) * 520}`);
  p.setAttribute("fill", "#ffd54a"); p.setAttribute("opacity", ".35");
  $("rays").appendChild(p);
}
const sparks = [];
for (let i = 0; i < 22; i++) {
  const s = document.createElementNS(SVGNS, "text");
  s.textContent = i % 3 ? "✦" : "$";
  s.setAttribute("font-size", 30 + (i % 4) * 10);
  s.setAttribute("fill", i % 2 ? "#ffe066" : "#7dffb0");
  s.setAttribute("text-anchor", "middle");
  s.setAttribute("opacity", 0);
  $("sparks").appendChild(s); sparks.push(s);
}

function setBubble(text) {
  const b = $("bubble"), t = $("bubText");
  if (!text) { b.setAttribute("opacity", 0); return; }
  b.setAttribute("opacity", 1);
  t.removeAttribute("textLength"); t.removeAttribute("lengthAdjust");
  t.textContent = text;
  if (t.getComputedTextLength() > 620) { t.setAttribute("textLength", 620); t.setAttribute("lengthAdjust", "spacingAndGlyphs"); }
}

/* ---------- СЦЕНА 1–2 ---------- */
function runStory() {
  // сброс
  $("faceThink").setAttribute("display", "inline");
  $("faceShock").setAttribute("display", "none");
  $("lid").setAttribute("fill", "#9aa3ad"); $("lid").removeAttribute("filter");
  $("lidLogo").setAttribute("display", "inline");
  $("lidPro").setAttribute("display", "none");
  $("rays").setAttribute("opacity", 0);
  sparks.forEach(s => s.setAttribute("opacity", 0));
  setBubble(null);
  let thoughtIdx = 0, upgraded = false;

  const WALK0 = 8000, WALK1 = 11400, JUMP1 = 12800;
  const GX0 = 2400, GX1 = 1330, GY = 1035;
  const LID = { x: 560, y: 866 };

  return anim(STORY_MS, t => {
    // мысли
    while (thoughtIdx < THOUGHTS.length && t >= THOUGHTS[thoughtIdx][0]) setBubble(THOUGHTS[thoughtIdx++][1]);
    const bub = $("bubble");
    const shout = t > 5300 && t < 6700; // "РЕЖУУУ" трясётся
    bub.setAttribute("transform", shout ? `translate(${Math.random() * 14 - 7},${Math.random() * 14 - 7})` : "");

    // глаза бегают, пока думает
    $("pupL").setAttribute("cx", -26 + Math.sin(t / 380) * 5); $("pupR").setAttribute("cx", 26 + Math.sin(t / 380) * 5);
    $("pupL").setAttribute("cy", 640 - Math.abs(Math.cos(t / 520)) * 3); $("pupR").setAttribute("cy", 640 - Math.abs(Math.cos(t / 520)) * 3);

    // качок
    const g = $("giant"), world = $("world");
    let shake = "";
    g.setAttribute("display", t >= WALK0 && t < JUMP1 ? "inline" : "none");
    if (t < WALK0) {
      g.setAttribute("transform", `translate(${GX0},${GY})`);
    } else if (t < WALK1) {
      const k = (t - WALK0) / (WALK1 - WALK0);
      const step = (t - WALK0) / 280;
      const swing = Math.sin(step * Math.PI) * 18;
      const bob = Math.abs(Math.sin(step * Math.PI)) * 18;
      g.setAttribute("transform", `translate(${lerp(GX0, GX1, k)},${GY - bob})`);
      $("gLegF").setAttribute("transform", `rotate(${swing},-60,-340)`);
      $("gLegB").setAttribute("transform", `rotate(${-swing},60,-340)`);
      $("gArmF").setAttribute("transform", `rotate(${-swing * .8},-205,-735)`);
      $("gArmB").setAttribute("transform", `rotate(${swing * .8},205,-735)`);
      if (bob < 3) shake = `translate(${Math.random() * 16 - 8},${Math.random() * 10 - 5})`; // топот
    } else if (t < JUMP1) {
      // прыжок в ноутбук: уменьшается и крутится
      const k = clamp01((t - WALK1) / (JUMP1 - WALK1));
      const e = k * k;
      const s = lerp(1, 0.02, e);
      const cx = lerp(GX1, LID.x, k);
      const cy = lerp(GY - 450, LID.y, k) - Math.sin(k * Math.PI) * 280;
      g.setAttribute("transform", `translate(${cx},${cy}) scale(${s}) rotate(${-k * 540}) translate(0,450)`);
      $("gLegF").setAttribute("transform", "rotate(-25,-60,-340)");
      $("gLegB").setAttribute("transform", "rotate(25,60,-340)");
      $("gArmF").setAttribute("transform", "rotate(60,-205,-735)");
      $("gArmB").setAttribute("transform", "rotate(-60,205,-735)");
    } else {
      g.setAttribute("transform", `translate(${GX0},${GY})`);
      if (!upgraded) {
        upgraded = true;
        $("faceThink").setAttribute("display", "none");
        $("faceShock").setAttribute("display", "inline");
        $("lid").setAttribute("fill", "url(#gold)"); $("lid").setAttribute("filter", "url(#glow)");
        $("lidLogo").setAttribute("display", "none");
        $("lidPro").setAttribute("display", "inline");
      }
      const u = t - JUMP1;
      $("rays").setAttribute("opacity", Math.min(1, u / 300));
      $("rays").setAttribute("transform", `translate(0,866) rotate(${u / 18})`);
      sparks.forEach((s, i) => {
        const ph = ((u / 1100) + i / sparks.length) % 1;
        const a = i * 2.4;
        s.setAttribute("x", Math.cos(a) * (60 + ph * 380));
        s.setAttribute("y", Math.sin(a) * (40 + ph * 300));
        s.setAttribute("opacity", 1 - ph);
      });
      if (u < 1500) shake = `translate(${Math.random() * 12 - 6},${Math.random() * 12 - 6})`;
      // Димон подпрыгивает от шока
      $("dima").setAttribute("transform", `translate(560,${-Math.abs(Math.sin(u / 160)) * (u < 1600 ? 30 : 0)})`);
    }
    world.setAttribute("transform", shake);
  });
}

/* ---------- СЦЕНА 3 ---------- */
function runText() {
  $("txt").innerHTML = `
    <div class="t1">ДИМОН PRO</div>
    <div class="t2">А ТЫ ВСЁ ЕЩЁ ГУГЛИШЬ?</div>
    <div class="t3">ХА!</div>
    <div class="t4">CHAT GPT PRO — ПРОСТО КРУТО. ХА 😎</div>`;
  return sleep(TEXT_MS);
}

/* ---------- СЦЕНА 4: tower defense ---------- */
function runTD(ms) {
  const c = $("tdc"), ctx = c.getContext("2d");
  const W = c.width = innerWidth, H = c.height = innerHeight;
  const P = [[-0.06, .3], [.3, .3], [.3, .72], [.64, .72], [.64, .38], [.9, .38]].map(([x, y]) => [x * W, y * H]);
  const seg = []; let total = 0;
  for (let i = 0; i < P.length - 1; i++) { const l = Math.hypot(P[i + 1][0] - P[i][0], P[i + 1][1] - P[i][1]); seg.push(l); total += l; }
  const posAt = d => {
    for (let i = 0; i < seg.length; i++) {
      if (d <= seg[i]) { const k = d / seg[i]; return [lerp(P[i][0], P[i + 1][0], k), lerp(P[i][1], P[i + 1][1], k)]; }
      d -= seg[i];
    }
    return P[P.length - 1];
  };
  const towers = [[.16, .52], [.47, .52], [.47, .14], [.8, .6], [.8, .17]].map(([x, y]) => ({ x: x * W, y: y * H, cd: Math.random() * 300, ang: 0, flash: 0 }));
  const R = Math.min(W, H);
  const range = R * .36, speed = total / 6.5;
  let enemies = [], bullets = [], booms = [], pops = [], kills = 0, spawnT = 0;
  const POPS = ["ХА!", "-1 DeepSeek", "PRO!", "БУМ", "ахахах", "не пройдёшь"];
  const t0 = performance.now(); let last = t0;

  function whale(x, y, s, hp, max) {
    ctx.save(); ctx.translate(x, y);
    ctx.fillStyle = "#4d6bfe"; ctx.strokeStyle = "#0b1a5c"; ctx.lineWidth = s * .08;
    ctx.beginPath(); ctx.moveTo(-s * .9, 0); ctx.lineTo(-s * 1.45, -s * .45); ctx.lineTo(-s * 1.35, s * .35); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.ellipse(0, 0, s, s * .6, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#c9d4ff"; ctx.beginPath(); ctx.ellipse(s * .1, s * .3, s * .65, s * .22, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(s * .55, -s * .15, s * .16, 0, 7); ctx.fill();
    ctx.fillStyle = "#000"; ctx.beginPath(); ctx.arc(s * .6, -s * .15, s * .08, 0, 7); ctx.fill();
    ctx.fillStyle = "#fff"; ctx.font = `bold ${s * .5}px Arial`; ctx.textAlign = "center";
    ctx.strokeStyle = "#000"; ctx.lineWidth = 4; ctx.strokeText("DeepSeek", 0, -s * .95); ctx.fillText("DeepSeek", 0, -s * .95);
    ctx.fillStyle = "#400"; ctx.fillRect(-s * .7, -s * .85, s * 1.4, s * .14);
    ctx.fillStyle = "#3f3"; ctx.fillRect(-s * .7, -s * .85, s * 1.4 * hp / max, s * .14);
    ctx.restore();
  }

  return new Promise(res => {
    (function frame(now) {
      const t = now - t0, dt = Math.min(50, now - last) / 1000; last = now;
      // спавн
      spawnT -= dt * 1000;
      if (t < ms - 4500 && spawnT <= 0) { enemies.push({ d: 0, hp: 4, max: 4, wob: Math.random() * 6 }); spawnT = 520; }
      enemies.forEach(e => { e.d += speed * dt; [e.x, e.y] = posAt(e.d); });
      enemies = enemies.filter(e => {
        if (e.d >= total) { pops.push({ x: e.x, y: e.y, txt: "БАЗА НЕ СДАЁТСЯ", t: 0 }); return false; }
        return e.hp > 0;
      });
      // башни
      towers.forEach(tw => {
        tw.cd -= dt * 1000; tw.flash = Math.max(0, tw.flash - dt * 6);
        let tgt = null, best = -1;
        enemies.forEach(e => { if (Math.hypot(e.x - tw.x, e.y - tw.y) < range && e.d > best) { best = e.d; tgt = e; } });
        if (tgt) {
          tw.ang = Math.atan2(tgt.y - tw.y, tgt.x - tw.x);
          if (tw.cd <= 0) { bullets.push({ x: tw.x, y: tw.y, e: tgt }); tw.cd = 260; tw.flash = 1; }
        }
      });
      // пули
      bullets = bullets.filter(b => {
        if (!enemies.includes(b.e)) return false;
        const dx = b.e.x - b.x, dy = b.e.y - b.y, dist = Math.hypot(dx, dy), v = R * 1.6 * dt;
        if (dist < v + 8) {
          b.e.hp--;
          if (b.e.hp <= 0) {
            kills++;
            for (let i = 0; i < 14; i++) booms.push({ x: b.e.x, y: b.e.y, vx: (Math.random() - .5) * R, vy: (Math.random() - .7) * R, t: 0 });
            pops.push({ x: b.e.x, y: b.e.y, txt: POPS[Math.random() * POPS.length | 0], t: 0 });
          }
          return false;
        }
        b.x += dx / dist * v; b.y += dy / dist * v; return true;
      });

      // --- рисуем ---
      ctx.fillStyle = "#16301a"; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = "rgba(255,255,255,.03)";
      for (let x = 0; x < W; x += R * .06) for (let y = 0; y < H; y += R * .06) if ((x + y) / (R * .06) % 2 < 1) ctx.fillRect(x, y, R * .06, R * .06);
      ctx.lineJoin = "round"; ctx.lineCap = "round";
      ctx.strokeStyle = "#6e5230"; ctx.lineWidth = R * .11; ctx.beginPath(); P.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke();
      ctx.strokeStyle = "#a5814b"; ctx.lineWidth = R * .085; ctx.stroke();
      // база
      const [bx, by] = P[P.length - 1];
      ctx.fillStyle = "#ffcc33"; ctx.strokeStyle = "#000"; ctx.lineWidth = 5;
      ctx.fillRect(bx, by - R * .12, R * .2, R * .2); ctx.strokeRect(bx, by - R * .12, R * .2, R * .2);
      for (let i = 0; i < 4; i++) { ctx.fillRect(bx + i * R * .055, by - R * .17, R * .035, R * .05); ctx.strokeRect(bx + i * R * .055, by - R * .17, R * .035, R * .05); }
      ctx.fillStyle = "#000"; ctx.font = `bold ${R * .04}px Impact, Arial`; ctx.textAlign = "center";
      ctx.fillText("ДИМОН", bx + R * .1, by - R * .01); ctx.fillText("PRO", bx + R * .1, by + R * .045);
      // враги
      enemies.forEach(e => whale(e.x, e.y + Math.sin(t / 150 + e.wob) * 4, R * .045, e.hp, e.max));
      // башни
      towers.forEach(tw => {
        const s = R * .05;
        ctx.fillStyle = "#2b2b2b"; ctx.strokeStyle = "#000"; ctx.lineWidth = 4;
        ctx.fillRect(tw.x - s, tw.y - s, s * 2, s * 2); ctx.strokeRect(tw.x - s, tw.y - s, s * 2, s * 2);
        ctx.save(); ctx.translate(tw.x, tw.y); ctx.rotate(tw.ang);
        ctx.fillStyle = "#ffd54a"; ctx.fillRect(0, -s * .2, s * 1.4, s * .4); ctx.strokeRect(0, -s * .2, s * 1.4, s * .4);
        if (tw.flash > 0) { ctx.fillStyle = `rgba(255,255,180,${tw.flash})`; ctx.beginPath(); ctx.arc(s * 1.5, 0, s * .45 * tw.flash, 0, 7); ctx.fill(); }
        ctx.restore();
        ctx.fillStyle = "#10a37f"; ctx.beginPath(); ctx.arc(tw.x, tw.y, s * .75, 0, 7); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#fff"; ctx.font = `bold ${s * .5}px Arial`; ctx.fillText("GPT", tw.x, tw.y + s * .18);
        ctx.fillStyle = "#ffd54a"; ctx.font = `bold ${s * .42}px Impact, Arial`; ctx.fillText("PRO", tw.x, tw.y + s * 1.45);
      });
      // пули
      bullets.forEach(b => {
        ctx.fillStyle = "#fff59d"; ctx.shadowColor = "#ffd54a"; ctx.shadowBlur = 15;
        ctx.beginPath(); ctx.arc(b.x, b.y, R * .008, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
      });
      // взрывы
      booms = booms.filter(p => {
        p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += R * 2 * dt;
        ctx.globalAlpha = Math.max(0, 1 - p.t / .7); ctx.fillStyle = Math.random() < .5 ? "#4d6bfe" : "#ffb300";
        ctx.fillRect(p.x, p.y, R * .012, R * .012); ctx.globalAlpha = 1; return p.t < .7;
      });
      pops = pops.filter(p => {
        p.t += dt;
        ctx.globalAlpha = Math.max(0, 1 - p.t / 1); ctx.font = `bold ${R * .045}px Impact, Arial`;
        ctx.fillStyle = "#ffe066"; ctx.strokeStyle = "#000"; ctx.lineWidth = 6;
        ctx.strokeText(p.txt, p.x, p.y - p.t * R * .12); ctx.fillText(p.txt, p.x, p.y - p.t * R * .12);
        ctx.globalAlpha = 1; return p.t < 1;
      });
      // HUD
      ctx.textAlign = "left"; ctx.font = `bold ${R * .055}px Impact, Arial`; ctx.lineWidth = 7;
      ctx.strokeStyle = "#000"; ctx.fillStyle = "#ffd54a";
      ctx.strokeText("GPT PRO TOWER DEFENSE", W * .02, R * .08); ctx.fillText("GPT PRO TOWER DEFENSE", W * .02, R * .08);
      ctx.textAlign = "right"; ctx.fillStyle = "#fff";
      const kt = `DeepSeek сбито: ${kills}`;
      ctx.strokeText(kt, W * .98, R * .08); ctx.fillText(kt, W * .98, R * .08);
      if (t > ms - 2600) {
        ctx.textAlign = "center"; ctx.font = `bold ${R * .14}px Impact, Arial`; ctx.lineWidth = 10;
        const sc = 1 + Math.max(0, 1 - (t - (ms - 2600)) / 300) * 2;
        ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(sc, sc);
        ctx.strokeText("ПОБЕДА PRO 🏆", 0, 0); ctx.fillStyle = "#ffd54a"; ctx.fillText("ПОБЕДА PRO 🏆", 0, 0);
        ctx.restore();
      }
      t < ms ? requestAnimationFrame(frame) : res();
    })(t0);
  });
}

/* ---------- СЦЕНА 5: туалет GPT PRO ---------- */
const WC_MS = 15500;
const wcBills = [];
for (let i = 0; i < 10; i++) {
  const g = document.createElementNS(SVGNS, "g");
  g.innerHTML = '<rect x="-30" y="-17" width="60" height="34" rx="4" fill="#2e8b3e" stroke="#0b3d16" stroke-width="3"/><text x="0" y="10" text-anchor="middle" font-size="28" font-family="Impact" fill="#d8ffcf">$</text>';
  g.setAttribute("opacity", 0);
  $("wcBills").appendChild(g); wcBills.push(g);
}
function wcBubble(id, lines) {
  const b = $(id), t = $(id === "wBub" ? "wBubText" : "cBubText");
  if (!lines) { b.setAttribute("opacity", 0); return; }
  b.setAttribute("opacity", 1);
  if (id === "wBub") { t.textContent = lines; return; }
  t.innerHTML = lines.map((l, i) => `<tspan x="1595" y="${150 + i * 66}">${l}</tspan>`).join("");
  t.setAttribute("font-size", 40);
}
function runWC() {
  const L1 = ["Увы, Дима, в РФ только так", "подписки покупаются."];
  const L2 = [...L1, "Я твой GPT PRO."];
  const L3 = [...L2, "Идём жарить токены? 🔥"];
  const steps = [
    [1200, "wBub", "Оплата... в бачок?"], [4500, "wBub", null],
    [5000, "wBub", "Ну... так надо, наверное"], [7500, "wBub", null],
    [9800, "cBub", L1], [11800, "cBub", L2], [12900, "cBub", L3],
  ];
  let si = 0;
  wcBubble("wBub", null); wcBubble("cBub", null);
  $("wFaceN").setAttribute("display", "inline"); $("wFaceS").setAttribute("display", "none");
  return anim(WC_MS, t => {
    while (si < steps.length && t >= steps[si][0]) { const [, id, v] = steps[si++]; wcBubble(id, v); }
    // крышка бачка
    const lid = t < 600 ? 0 : t < 1000 ? (t - 600) / 400 : t < 4300 ? 1 : t < 4600 ? 1 - (t - 4300) / 300 : 0;
    $("tankLid").setAttribute("transform", `translate(${-30 * lid},${-80 * lid}) rotate(${-14 * lid},1060,485)`);
    // рука с деньгами
    $("wArmF").setAttribute("transform", `translate(872,612) rotate(${-100 * lid})`);
    $("wCash").setAttribute("display", t < 4300 ? "inline" : "none");
    // деньги летят в бачок
    wcBills.forEach((b, i) => {
      const k = (t - 1200 - i * 280) / 650;
      if (k < 0 || k > 1) { b.setAttribute("opacity", 0); return; }

/* ---------- хакерский дождь из фраз ---------- */
function runRain(ms) {
  const c = $("rain"), ctx = c.getContext("2d");
  const W = c.width = innerWidth, H = c.height = innerHeight;
  const fs = Math.max(14, Math.round(W / 70));
  const cols = Math.ceil(W / fs);
  const drops = Array.from({ length: cols }, () => ({
    y: Math.random() * -H / fs,
    text: RAIN_PHRASES[Math.random() * RAIN_PHRASES.length | 0],
    i: 0,
  }));
  ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, H);
  ctx.font = `bold ${fs}px Consolas, monospace`;
  const end = performance.now() + ms;
  return new Promise(res => {
    let last = 0;
    (function frame(t) {
      if (t > end) return res();
      if (t - last > 45) {
        last = t;
        ctx.fillStyle = "rgba(0,0,0,0.09)"; ctx.fillRect(0, 0, W, H);
        drops.forEach((d, x) => {
          const ch = d.text[d.i % d.text.length];
          ctx.fillStyle = Math.random() < .08 ? "#eaffea" : (Math.random() < .05 ? "#ffd54a" : "#00ff66");
          ctx.fillText(ch, x * fs, d.y * fs);
          d.y++; d.i++;
          if (d.y * fs > H && Math.random() > .96) {
            d.y = 0; d.i = 0;
            d.text = RAIN_PHRASES[Math.random() * RAIN_PHRASES.length | 0];
          }
        });
      }
      requestAnimationFrame(frame);
    })(0);
  });
}

/* ---------- море и дельфин ---------- */
function wavePath(t, amp, base, k, phase) {
  let d = `M0 300 L0 ${base}`;
  for (let x = 0; x <= 1000; x += 20) d += ` L${x} ${base + Math.sin(x * k + t + phase) * amp}`;
  return d + " L1000 300 Z";
}

function bill(x, y, size, vx, vy, life) {
  const b = document.createElement("div");
  b.className = "bill";
  b.textContent = Math.random() < .5 ? "$" : "💵";
  b.style.fontSize = size + "px";
  $("sea").appendChild(b);
  const t0 = performance.now();
  (function f(t) {
    const k = (t - t0) / life;
    if (k >= 1) return b.remove();
    const px = x + vx * k * life / 16, py = y + vy * k * life / 16 + 0.5 * 900 * (k * life / 1000) ** 2;
    b.style.transform = `translate(${px}px, ${py}px) rotate(${k * 360 * Math.sign(vx)}deg)`;
    b.style.opacity = 1 - k;
    requestAnimationFrame(f);
  })(t0);
}

function runSea(ms) {
  const W = innerWidth, H = innerHeight;
  const dol = $("dolphin");
  const mc = $("moneyrain"), mctx = mc.getContext("2d");
  mc.width = W; mc.height = H;
  const coins = Array.from({ length: 60 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: 14 + Math.random() * 24, v: 1 + Math.random() * 3 }));
  const seaLine = H * 0.74;
  const jumpMs = 2600, startJump = 300;
  const t0 = performance.now();
  let splashed = false;
  return new Promise(res => {
    (function frame(now) {
      const t = now - t0;
      if (t > ms) { $("sea").querySelectorAll(".bill").forEach(b => b.remove()); return res(); }
      // волны
      $("wave1").setAttribute("d", wavePath(t / 400, 14, 110, 0.012, 0));
      $("wave2").setAttribute("d", wavePath(t / 300, 10, 150, 0.016, 2));
      // денежный дождь
      mctx.clearRect(0, 0, W, H);
      coins.forEach(c => {
        c.y += c.v; if (c.y > H) { c.y = -30; c.x = Math.random() * W; }
        mctx.font = `bold ${c.s}px Arial`; mctx.fillStyle = "rgba(255,213,74,.35)";
        mctx.fillText("$", c.x, c.y);
      });
      // прыжок дельфина
      const dw = dol.getBoundingClientRect().width || W * .34;
      let k = Math.min(Math.max((t - startJump) / jumpMs, 0), 1);
      const x0 = -dw * 0.9, x1 = W * 0.78;
      const peak = H * 0.5;
      const x = x0 + (x1 - x0) * k;
      const y = seaLine - 4 * peak * k * (1 - k);
      const dx = (x1 - x0), dy = -4 * peak * (1 - 2 * k);
      const ang = Math.atan2(dy, dx) * 180 / Math.PI;
      dol.style.transform = `translate(${x - dw / 2}px, ${y - dw * 0.22}px) rotate(${ang}deg)`;
      dol.style.opacity = k >= 1 ? 0 : 1;
      if (k > 0 && k < 1 && Math.random() < .5) bill(x, y, 18 + Math.random() * 18, -2 - Math.random() * 3, -2 + Math.random() * 3, 1200);
      if (k > 0.05 && k < 0.12 && Math.random() < .6) bill(x, seaLine, 26, (Math.random() - .5) * 8, -6 - Math.random() * 6, 1400);
      if (k >= 1 && !splashed) {
        splashed = true;
        for (let i = 0; i < 70; i++) bill(x1, seaLine, 22 + Math.random() * 30, (Math.random() - .5) * 14, -8 - Math.random() * 12, 1600);
      }
      requestAnimationFrame(frame);
    })(t0);
  });
}

const fsDrops = [...Array(18)].map(() => { const c = document.createElementNS(SVGNS, "circle"); c.setAttribute("r", 10); c.setAttribute("fill", "#e1f5fe"); $("fsSplash").appendChild(c); return { c, vx: (Math.random() - .5) * 600, vy: -400 - Math.random() * 400 }; });
function runFish() {
  show("fs");
  const SAY = [[3200, "Отпусти меня, Димон — исполню 3 желания!"], [7600, "Готово. С тебя подписка PRO 😏"], [10600, null]];
  const tip = [760, 300];
  return anim(12500, t => {
    $("fsWave").setAttribute("transform", `translate(${-(t / 10 % 240)},${Math.sin(t / 300) * 4})`);
    const pull = t > 2200 && t < 3000 ? clamp01((t - 2200) / 800) : t >= 3000 ? 1 : 0;
    const rodTip = [lerp(760, 640, pull), lerp(300, 220, pull)];

    $("fsFish").setAttribute("opacity", t > 2200 && released < 1 ? 1 : 0);
    $("fsFish").setAttribute("transform", `translate(${fishX},${fishY + (t > 3000 && !released ? Math.sin(t / 120) * 8 : 0)}) rotate(${released ? 40 + released * 60 : Math.sin(t / 90) * 8})`);
    $("fsLine").setAttribute("d", t < 2400 ? `M${rodTip[0]} ${rodTip[1]} Q${(rodTip[0] + fx) / 2} ${fy - 60} ${fx} ${fy}` : released ? "" : `M${rodTip[0]} ${rodTip[1]} L${fishX + 100} ${fishY - 20}`);
    let s = null; SAY.forEach(([a, x]) => { if (t >= a) s = x; });

    if (s && $("fsTxt").textContent !== s) { $("fsTxt").textContent = s; $("fsTxt").removeAttribute("textLength"); if ($("fsTxt").getComputedTextLength() > 920) { $("fsTxt").setAttribute("textLength", 920); $("fsTxt").setAttribute("lengthAdjust", "spacingAndGlyphs"); } }

    const sk = clamp01((t - 11500) / 900);
    fsDrops.forEach(d => { d.c.setAttribute("cx", 1300 + d.vx * sk); d.c.setAttribute("cy", 640 + d.vy * sk + 900 * sk * sk); d.c.setAttribute("opacity", sk > 0 && sk < 1 ? 1 : 0); });

}

const exB = [...Array(5)].map(() => { const g = document.createElementNS(SVGNS, "g"); g.innerHTML = `<rect x="-170" y="-40" width="340" height="64" rx="32" fill="#fff" stroke="#000" stroke-width="4"/><text x="0" y="4" text-anchor="middle" font-size="30" font-weight="900" font-family="Segoe UI, Arial" fill="#111"></text>`; g.setAttribute("opacity", 0); $("exBubs").appendChild(g); return g; });
function exSay(i, x, y, txt) {

                show("sea"); await runSea(DOLPHIN_MS);
                show("pro"); runPro(); await sleep(PRO_MS); },

async function playShow() {
  if (busy) return; busy = true;
  stage.classList.add("on");
  await VARIANTS[showCount++ % VARIANTS.length]();
  stage.classList.remove("on");
  await sleep(450);
  show(null);
  busy = false;
}

// если страница только что сама обновилась на новую версию — показываем сразу
const JUST_UPDATED = new URLSearchParams(location.search).has("v");
(async () => {
  await sleep(JUST_UPDATED ? 1500 : FIRST_MS);
  while (true) {
    const start = performance.now();
    await playShow();
    await sleep(Math.max(0, EVERY_MS - (performance.now() - start))); // следующий — через минуту после начала этого
  }
})();

/* ---------- автообновление ----------
   Каждые 10 сек страница смотрит version.txt. Если версия поменялась —
   тихо перезагружается (только когда экран прозрачный, не посреди шоу).
   Ссылка в OBS при этом остаётся той же. */
let myVersion = null;
async function checkUpdate() {
  try {
    const r = await fetch("version.txt?nocache=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const v = (await r.text()).trim();
    if (myVersion === null) { myVersion = v; return; }
    if (v !== myVersion) {
      while (busy) await sleep(500);
      // новый адрес только внутри страницы — обходит кэш; в OBS ссылка не меняется
      location.replace(location.pathname + "?v=" + encodeURIComponent(v));
    }
  } catch (e) { /* нет интернета — просто пробуем позже */ }
}
checkUpdate();
setInterval(checkUpdate, 10000);
