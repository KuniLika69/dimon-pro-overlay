<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Dimon Chat Memes</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: Impact, "Arial Black", sans-serif; }

  /* карточки-мемы */
  #stack { position: fixed; left: calc(3vw + clamp(200px, 22vw, 420px)); right: 2vw; bottom: 6vh; max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 1.2vh; pointer-events: none; }
  .alert { position: relative; display: flex; align-items: center; gap: 2vw; width: 100%; padding: 1.8vh 2vw; box-sizing: border-box;
           background: rgba(10, 12, 20, .92); border: 4px solid #ffd54a; border-radius: 26px; box-shadow: 0 0 40px rgba(255, 213, 74, .45), 0 10px 0 rgba(0,0,0,.35);
           animation: pop .5s cubic-bezier(.2, 1.6, .4, 1) both; }
  .alert.out { animation: away .45s ease-in forwards; }
  @keyframes pop { from { transform: translateY(120%) scale(.6) rotate(-4deg); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes away { to { transform: translateY(40px) scale(.85); opacity: 0; } }

  .meme { flex: 1; text-align: center; min-width: 0; }
  .nick { font-size: clamp(26px, 3.6vw, 64px); line-height: 1; letter-spacing: .02em; text-shadow: 3px 3px 0 #000, 0 0 18px currentColor; word-break: break-word; }
  .emo { font-size: clamp(40px, 5vw, 90px); line-height: 1.1; animation: wob .5s ease-in-out infinite alternate; display: inline-block; }
  @keyframes wob { from { transform: rotate(-8deg) scale(.95); } to { transform: rotate(8deg) scale(1.08); } }
  .top, .bot { color: #fff; font-size: clamp(20px, 2.5vw, 46px); line-height: 1.1; text-transform: uppercase;
               -webkit-text-stroke: 1.5px #000; text-shadow: 3px 3px 0 #000; }
  .bot { color: #ffe066; }
  .quote { margin-top: .8vh; font: 600 clamp(13px, 1.3vw, 24px) "Segoe UI", Arial, sans-serif; color: #b0bec5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Дима ржёт */
  .dima { flex: 0 0 auto; width: clamp(110px, 12vw, 210px); position: relative; animation: laugh .18s ease-in-out infinite alternate; }
  @keyframes laugh { from { transform: rotate(-6deg) translateY(0); } to { transform: rotate(6deg) translateY(-6px); } }
  .ha { position: absolute; left: 50%; top: -38%; transform: translateX(-50%); white-space: nowrap; color: #ff3b6b; font-size: clamp(20px, 2.4vw, 44px);
        -webkit-text-stroke: 1px #000; text-shadow: 3px 3px 0 #000; animation: haha .3s steps(2) infinite; }
  @keyframes haha { 50% { transform: translateX(-50%) scale(1.15) rotate(-4deg); } }

  /* Дима в квадрате слева */
  #box { position: fixed; left: 1.5vw; top: 50%; transform: translateY(-50%); width: clamp(200px, 22vw, 420px); aspect-ratio: 1; border: 4px solid #ffd54a; border-radius: 22px; overflow: hidden; box-shadow: 0 0 30px rgba(255,213,74,.35); background: #160a2a; }
  #box svg { width: 100%; height: 100%; display: block; }
  #prompt { position: fixed; left: 1.5vw; width: clamp(200px, 22vw, 420px); box-sizing: border-box; padding: 1.2vh 1vw; background: #fff; border: 3px solid #000; border-radius: 18px;
            font: 800 clamp(14px, 1.35vw, 26px) "Segoe UI", Arial, sans-serif; color: #111; opacity: 0; transition: opacity .3s, transform .3s; transform: translateY(10px); }
  #prompt.on { opacity: 1; transform: none; }
  #prompt b { color: #10a37f; font-family: Consolas, monospace; }
  #prompt::after { content: ""; position: absolute; left: 50%; bottom: -16px; border: 9px solid transparent; border-top-color: #000; transform: translateX(-50%); }

  /* старый монитор по центру */
  #crt { position: fixed; left: 50%; top: 38%; transform: translate(-50%, -50%); width: clamp(260px, 32vw, 620px); }
  .crtCase { background: linear-gradient(160deg, #e8dfc8, #b9ad8f); border: 4px solid #5a5240; border-radius: 26px; padding: 6% 6% 9%; box-shadow: 0 18px 0 #6e6450, 0 24px 40px rgba(0,0,0,.5); position: relative; }
  .crtCase::after { content: "GPT PRO 2000"; position: absolute; left: 7%; bottom: 2.5%; font: clamp(9px, .9vw, 16px) Impact, sans-serif; color: #5a5240; letter-spacing: .1em; }
  .crtLed { position: absolute; right: 8%; bottom: 3.5%; width: 10px; height: 10px; border-radius: 50%; background: #39ff14; box-shadow: 0 0 10px #39ff14; animation: led 1.2s steps(2) infinite; }
  @keyframes led { 50% { opacity: .3; } }
  .crtScreen { position: relative; aspect-ratio: 4/3; background: radial-gradient(ellipse at center, #062b12 0%, #021306 75%, #000 100%); border-radius: 18px / 24px; overflow: hidden;
               box-shadow: inset 0 0 40px rgba(0,0,0,.9), inset 0 0 8px #0f0; border: 6px solid #2b2618; }
  .crtScreen::before { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 2px, transparent 2px 4px); pointer-events: none; z-index: 3; animation: flick .12s infinite; }
  @keyframes flick { 50% { opacity: .85; } }
  #crtText { position: absolute; inset: 4%; font: 600 clamp(8px, .95vw, 17px)/1.3 Consolas, "Courier New", monospace; color: #39ff14; text-shadow: 0 0 6px #39ff14; white-space: pre-wrap; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
  #crtText .r { color: #ff5252; text-shadow: 0 0 6px #ff5252; } #crtText .y { color: #ffe066; text-shadow: 0 0 6px #ffe066; }
  .err { position: absolute; z-index: 2; width: 62%; background: #c0c0c0; border: 2px solid; border-color: #fff #404040 #404040 #fff; font: 700 clamp(8px, .85vw, 15px) Tahoma, Arial, sans-serif; color: #000;
         animation: errPop .18s steps(2) both; box-shadow: 3px 3px 0 rgba(0,0,0,.5); }
  .err .ttl { background: linear-gradient(90deg, #000080, #1084d0); color: #fff; padding: 2px 5px; display: flex; justify-content: space-between; }
  .err .ttl span:last-child { background: #c0c0c0; color: #000; padding: 0 4px; border: 1px solid; border-color: #fff #404040 #404040 #fff; }
  .err .bd { padding: 6px 8px; display: flex; gap: 6px; align-items: center; }
  .err .ic { font-size: 1.8em; line-height: 1; }
  .err .ok { display: block; margin: 0 auto 6px; width: 30%; text-align: center; border: 2px solid; border-color: #fff #404040 #404040 #fff; padding: 1px; }
  @keyframes errPop { from { transform: scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }

  /* чиби-нейронки */
  #agents { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .chibi { position: absolute; left: 0; top: 0; width: clamp(90px, 8vw, 150px); will-change: transform; }
  .chibi svg { width: 100%; display: block; }
  .chibi .tag { position: absolute; left: 50%; top: -14%; transform: translateX(-50%); white-space: nowrap; font: clamp(12px, 1.1vw, 20px) Impact, sans-serif; color: #fff; -webkit-text-stroke: 1px #000; text-shadow: 2px 2px 0 #000; }
  .chibi .say { position: absolute; left: 50%; bottom: 112%; transform: translateX(-50%); width: max-content; max-width: clamp(160px, 16vw, 300px); background: #fff; border: 3px solid #000; border-radius: 14px; padding: 6px 10px;
                font: 800 clamp(12px, 1.1vw, 20px) "Segoe UI", Arial, sans-serif; color: #111; text-align: center; opacity: 0; transition: opacity .2s; }
  .chibi .say.on { opacity: 1; }

  /* звонок эйчара */
  #call { position: fixed; right: 1.5vw; bottom: 3vh; width: clamp(240px, 26vw, 500px); background: rgba(12, 14, 24, .95); border: 4px solid #4caf50; border-radius: 22px;
          box-shadow: 0 0 30px rgba(76,175,80,.45); font-family: "Segoe UI", Arial, sans-serif; color: #fff; overflow: hidden; display: none; }
  #call.on { display: block; animation: pop .45s cubic-bezier(.2,1.6,.4,1) both; }
  #call.ring { animation: ringShake .12s infinite; border-color: #ffd54a; }
  @keyframes ringShake { 0%,100% { transform: rotate(-2deg); } 50% { transform: rotate(2deg) translateX(3px); } }
  .cHead { display: flex; align-items: center; gap: 1vw; padding: 1.4vh 1.2vw; background: linear-gradient(90deg, #1b5e20, #2e7d32); }
  .cAva { width: clamp(46px, 4.5vw, 84px); flex: 0 0 auto; }
  .cName { font: 900 clamp(15px, 1.5vw, 28px) "Segoe UI", Arial; }
  .cCo { font: 700 clamp(11px, 1vw, 19px) "Segoe UI", Arial; color: #c8e6c9; }
  .cTime { margin-left: auto; font: 900 clamp(13px, 1.2vw, 22px) Consolas, monospace; color: #b9f6ca; }
  .cRing { padding: 2vh 1.2vw; text-align: center; font: 900 clamp(16px, 1.7vw, 32px) Impact, sans-serif; color: #ffd54a; letter-spacing: .03em; }
  #cLog { padding: 1.2vh 1vw; display: flex; flex-direction: column; gap: .9vh; min-height: 10vh; }
  .cm { max-width: 86%; padding: .9vh .9vw; border-radius: 14px; font: 700 clamp(12px, 1.15vw, 21px)/1.25 "Segoe UI", Arial; animation: rise .25s ease-out; }
  .cm.hr { align-self: flex-start; background: #37474f; border: 2px solid #90a4ae; }
  .cm.dm { align-self: flex-end; background: #2f6fed; }
  .cm b { display: block; font-size: .8em; opacity: .75; }
  @keyframes rise { from { transform: translateY(12px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* звонок эйчара — внутри экрана старого монитора */
  .crtScreen #call { position: absolute; inset: 0; right: auto; bottom: auto; top: auto; width: auto; border: none; border-radius: 0; z-index: 2; box-shadow: none;
                     background: radial-gradient(ellipse at center, #0b3d1c 0%, #031a0a 80%); }
  .crtScreen #call .cHead { padding: 2% 3%; }
  .crtScreen #call .cAva { width: 13%; }
  .crtScreen #call .cName { font-size: clamp(11px, 1.15vw, 22px); }
  .crtScreen #call .cCo, .crtScreen #call .cTime { font-size: clamp(9px, .85vw, 16px); }
  .crtScreen #call .cRing { font-size: clamp(13px, 1.5vw, 28px); padding: 10% 3%; text-shadow: 0 0 10px #ffd54a; }
  .crtScreen #call #cLog { padding: 2% 3%; gap: 4%; }
  .crtScreen #call .cm { font-size: clamp(9px, .95vw, 17px); padding: 1.5% 2.5%; }
  .crtScreen.calling #crtText, .crtScreen.calling .err { visibility: hidden; }

  /* билборд с мультиками под монитором */
  #bb { position: fixed; left: 50%; bottom: 2.5vh; transform: translateX(-50%); width: clamp(240px, 26vw, 500px); }
  .bbFrame { position: relative; aspect-ratio: 16/9; background: radial-gradient(circle, #1b1036, #07030f); border: 6px solid #2b2b2b; border-radius: 10px; overflow: hidden;
             box-shadow: 0 0 0 4px #ffd54a, 0 0 25px rgba(255,213,74,.5); }
  .bbFrame iframe { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; border: 0; transform-origin: 0 0; pointer-events: none; background: transparent; }
  .bbLights { position: absolute; inset: -12px; border-radius: 16px; pointer-events: none;
              background: repeating-linear-gradient(90deg, #ffd54a 0 6px, transparent 6px 18px) top / 100% 5px no-repeat,
                          repeating-linear-gradient(90deg, #ffd54a 0 6px, transparent 6px 18px) bottom / 100% 5px no-repeat; animation: led 1s steps(2) infinite; }
  .bbTag { position: absolute; left: 50%; top: -1.2em; transform: translateX(-50%); background: #c62828; color: #fff; font: clamp(11px, 1vw, 18px) Impact, sans-serif;
           padding: 1px 12px; border: 2px solid #000; border-radius: 8px; z-index: 2; letter-spacing: .08em; }

  /* мини-игра «Угадай бренд» */
  #game { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
  .gc { position: absolute; left: 0; top: 0; width: auto; border-radius: 12px !important; min-width: clamp(54px, 4vw, 80px); padding: .4vh .5vw; box-sizing: border-box; text-align: center; background: rgba(255,255,255,.93);
        border: 3px solid #000; border-radius: 16px; box-shadow: 0 6px 0 rgba(0,0,0,.35); will-change: transform; }
  .gc .ge { font-size: clamp(20px, 1.8vw, 34px); line-height: 1.1; }
  .gc .gh { font: 900 clamp(10px, .8vw, 15px)/1.1 Consolas, "Courier New", monospace; color: #222; letter-spacing: .08em; white-space: nowrap; }
  .gc .gn { display: none; font: clamp(11px, .9vw, 17px) Impact, sans-serif; color: #2e7d32; white-space: nowrap; }
  .gc.won { border-color: #39ff14; box-shadow: 0 0 20px #39ff14; animation: gWin .9s ease-in forwards; }
  .gc.won .gh { display: none; } .gc.won .gn { display: block; }
  .gc.miss { animation: gMiss .8s ease-in forwards; } .gc.miss .gh { display: none; } .gc.miss .gn { display: block; color: #c62828; }
  @keyframes gWin { 0% { transform: var(--p) scale(1); } 30% { transform: var(--p) scale(1.35) rotate(-8deg); } 100% { transform: var(--p) scale(0) rotate(30deg); opacity: 0; } }
  @keyframes gMiss { to { transform: var(--p) translateY(40px); opacity: 0; } }
  #gPanel { position: fixed; left: 1.5vw; bottom: 2.5vh; width: clamp(200px, 22vw, 420px); background: rgba(10,12,20,.92); border: 3px solid #ff4fd8; border-radius: 16px;
            color: #fff; font-family: "Segoe UI", Arial, sans-serif; overflow: hidden; z-index: 3; }
  #gPanel .gt { background: #4a148c; padding: .7vh .8vw; font: clamp(12px, 1.1vw, 20px) Impact, sans-serif; display: flex; justify-content: space-between; }
  #gPanel .gt span { color: #ffd54a; font-family: Consolas, monospace; }
  #gLast { padding: .5vh .8vw; font: 800 clamp(11px, .95vw, 17px) "Segoe UI", Arial; color: #7dffb0; min-height: 1.3em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #gTop { padding: 0 .8vw .7vh; font: 700 clamp(10px, .9vw, 16px)/1.35 "Segoe UI", Arial; }
  #gTop div { display: flex; justify-content: space-between; } #gTop b { color: #ffd54a; }

  /* окно сериала справа */
  #serial { position: fixed; right: 1.5vw; top: 3vh; width: clamp(240px, 24vw, 460px); height: 46vh; background: rgba(10, 12, 20, .9); border: 3px solid #607d8b;
            border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; font-family: "Segoe UI", Arial, sans-serif; box-shadow: 0 0 24px rgba(0,0,0,.5); }
  .sHead { padding: 1vh 1vw; background: #263238; color: #fff; font: 900 clamp(13px, 1.25vw, 24px) Impact, sans-serif; letter-spacing: .03em; }
  .sHead span { font: 700 .6em "Segoe UI", Arial; color: #ff5252; margin-left: .6vw; animation: led 1.4s steps(2) infinite; }
  #serialLog { flex: 1; padding: 1vh 1vw; display: flex; flex-direction: column; justify-content: flex-end; gap: .8vh; overflow: hidden; }
  .sr { color: #eceff1; font: 600 clamp(12px, 1.1vw, 20px)/1.3 "Segoe UI", Arial, sans-serif; animation: rise .35s ease-out; }
  .sr b { font-weight: 900; }
  .sr.title { text-align: center; color: #ffd54a; font: clamp(13px, 1.2vw, 22px) Impact, sans-serif; letter-spacing: .05em; padding: .4vh 0; border-top: 1px dashed #607d8b; border-bottom: 1px dashed #607d8b; }

  /* дельфин */
  #dolphin { position: fixed; left: 0; top: 0; width: clamp(80px, 7vw, 140px); pointer-events: none; will-change: transform; filter: drop-shadow(0 4px 6px rgba(0,0,0,.35)); z-index: 5; }
  #dlNick { position: absolute; left: 50%; bottom: 100%; transform: translateX(-50%); white-space: nowrap; font: clamp(12px, 1vw, 18px) Impact, sans-serif; color: #fff;
            -webkit-text-stroke: 1px #000; text-shadow: 2px 2px 0 #000; opacity: 0; transition: opacity .3s; }
  #dlNick.on { opacity: 1; }
  .bub { position: fixed; width: 12px; height: 12px; border-radius: 50%; border: 2px solid rgba(255,255,255,.9); pointer-events: none; z-index: 4; animation: bub 1.2s ease-out forwards; }
  @keyframes bub { to { transform: translateY(-60px) scale(1.6); opacity: 0; } }

  /* статус (виден только в тест-режиме) */
  #status { position: fixed; top: 8px; left: 8px; font: 600 14px "Segoe UI", Arial; color: #fff; background: rgba(0,0,0,.6); padding: 4px 10px; border-radius: 8px; display: none; }
</style>
</head>

const normT = s => String(s).toLowerCase().replace(/ё/g, "е").replace(/[^a-zа-я0-9&\s]/g, " ").replace(/\s+/g, " ").trim();
function lev(a, b) {
  const m = a.length, n = b.length; if (!m) return n; if (!n) return m;
  // расстояние с учётом перестановки соседних букв (nkie → nike = 1 ошибка)
  const d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 0; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) {
    const c = a[i - 1] === b[j - 1] ? 0 : 1;
    d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + c);
    if (i > 1 && j > 1 && a[i - 1] === b[j - 2] && a[i - 2] === b[j - 1]) d[i][j] = Math.min(d[i][j], d[i - 2][j - 2] + 1);
  }
  return d[m][n];
}
// засчитываем, если похоже: точное слово, или опечатка в 1–2 буквы (по длине), или совпадение фразой
function matches(msg, alias) {
  const m = normT(msg), a = normT(alias); if (!m || !a) return false;
  const nospace = s => s.replace(/\s/g, "");
  if (a.length <= 2) return m.split(" ").includes(a);
  if ((" " + m + " ").includes(" " + a + " ") || nospace(m).includes(nospace(a))) return true;
  const allow = a.length <= 4 ? 1 : a.length <= 8 ? 2 : 3;
  const words = m.split(" ");
  for (let i = 0; i < words.length; i++) for (let k = 1; k <= 3 && i + k <= words.length; k++) {
    const chunk = words.slice(i, i + k).join("");
    if (Math.abs(chunk.length - nospace(a).length) <= allow && lev(chunk, nospace(a)) <= allow) return true;
  }
  return false;
}
const GAME_ROUND_MS = 60000, GAME_PER_ROUND = 7;
const BRAND_ORDER = (() => { const r = seeded(777), o = [...BRANDS.keys()]; for (let i = o.length - 1; i > 0; i--) { const j = r() * (i + 1) | 0; [o[i], o[j]] = [o[j], o[i]]; } return o; })();
let gameCards = [], gameRound = -1;
let gameTop = store.get("gameTop", {});
function renderTop() {
  const top = Object.entries(gameTop).sort((a, b) => b[1] - a[1]).slice(0, 5);

}
function startRound(round) {
  gameRound = round;
  gameCards.forEach(c => { if (!c.done) { c.el.classList.add("miss"); setTimeout(() => c.el.remove(), 800); } });
  const saved = store.get("gameRound", {});
  const guessed = saved.round === round ? saved.ids || [] : [];
  const r = seeded(round * 97 + 13);
  gameCards = [];
  for (let k = 0; k < GAME_PER_ROUND; k++) {
    const id = BRAND_ORDER[(round * GAME_PER_ROUND + k) % BRAND_ORDER.length];
    if (guessed.includes(id)) continue;
    const [name, emo] = BRANDS[id];
    const hint = [...name].map((ch, i) => i === 0 ? ch.toUpperCase() : /[\s&'-]/.test(ch) ? ch : "_").join("");
    const el = document.createElement("div");
    el.className = "gc";

    el.innerHTML = `<div class="ge">${emo}</div><div class="gh" style="color:${fg}">${esc(hint)}</div><div class="gn" style="color:${fg}">${esc(name)}</div>`;
    $("game").appendChild(el);
    gameCards.push({ id, el, x: 0.3 + r() * 0.4, y: 0.12 + r() * 0.6, a: r() * Math.PI * 2, sp: .0009 + r() * .0007, done: false });
  }
  if (saved.round !== round) store.set("gameRound", { round, ids: [] });
}
function gameGuess(nick, text) {
  for (const c of gameCards) {
    if (c.done) continue;
    if (BRANDS[c.id][3].some(a => matches(text, a)) || matches(text, BRANDS[c.id][0])) {
      c.done = true;
      c.el.classList.add("won");
      setTimeout(() => c.el.remove(), 950);
      gameTop[nick] = (gameTop[nick] || 0) + 1; store.set("gameTop", gameTop); renderTop();
      const st = store.get("gameRound", { round: gameRound, ids: [] }); st.round = gameRound; st.ids = [...(st.ids || []), c.id]; store.set("gameRound", st);
      $("gLast").textContent = `✔ ${nick} угадал: ${BRANDS[c.id][0]} (+1)`;
      return true;
    }
  }
  return false;
}
(() => {
  renderTop();
  (function f() {
    const now = Date.now(), round = Math.floor(now / GAME_ROUND_MS);
    if (round !== gameRound) startRound(round);
    const left = Math.ceil((GAME_ROUND_MS - now % GAME_ROUND_MS) / 1000);
    $("gTimer").textContent = `0:${String(left).padStart(2, "0")}`;
    const W = innerWidth, H = innerHeight;
    gameCards.forEach((c, i) => {
      if (c.done) return;
      c.a += (Math.random() - .5) * .05;
      c.x += Math.cos(c.a) * c.sp; c.y += Math.sin(c.a) * c.sp;
      if (c.x < .02 || c.x > .9) { c.a = Math.PI - c.a; c.x = Math.max(.02, Math.min(.9, c.x)); }
      if (c.y < .02 || c.y > .82) { c.a = -c.a; c.y = Math.max(.02, Math.min(.82, c.y)); }
      const p = `translate(${c.x * W}px,${c.y * H}px)`;
      c.el.style.setProperty("--p", p);
      c.el.style.transform = `${p} rotate(${Math.sin(Date.now() / 600 + i) * 6}deg)`;
    });
    requestAnimationFrame(f);

})();

/* ---------- автообновление: новая версия подхватывается сама, ссылка в OBS та же ---------- */
let myVersion = null;
async function checkUpdate() {
  try {
    const r = await fetch("version.txt?nocache=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const v = (await r.text()).trim();
    if (myVersion === null) { myVersion = v; return; }
    if (v !== myVersion) {
      const keep = new URLSearchParams(location.search); keep.set("v", v);
      location.replace(location.pathname + "?" + keep.toString());
    }
  } catch (e) {}
}
checkUpdate();
setInterval(checkUpdate, 10000);
