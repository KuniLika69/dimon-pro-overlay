<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Dimon Chat Memes</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; font-family: Impact, "Arial Black", sans-serif; }

  /* карточки-мемы */
  #stack { position: fixed; left: calc(3vw + clamp(200px, 22vw, 420px)); right: 2vw; bottom: 6vh; max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; gap: 1.2vh; pointer-events: none; }
  .alert { position: relative; display: flex; align-items: center; gap: 2vw; width: 100%; padding: 1.8vh 2vw; box-sizing: border-box;
           background: rgba(10, 12, 20, .92); border: 4px solid #ffd54a; border-radius: 26px; box-shadow: 0 0 40px rgba(255, 213, 74, .45), 0 10px 0 rgba(0,0,0,.35);
           animation: pop .5s cubic-bezier(.2, 1.6, .4, 1) both; }
  .alert.out { animation: away .45s ease-in forwards; }
  @keyframes pop { from { transform: translateY(120%) scale(.6) rotate(-4deg); opacity: 0; } to { transform: none; opacity: 1; } }
  @keyframes away { to { transform: translateY(40px) scale(.85); opacity: 0; } }

  .meme { flex: 1; text-align: center; min-width: 0; }
  .nick { font-size: clamp(26px, 3.6vw, 64px); line-height: 1; letter-spacing: .02em; text-shadow: 3px 3px 0 #000, 0 0 18px currentColor; word-break: break-word; }
  .emo { font-size: clamp(40px, 5vw, 90px); line-height: 1.1; animation: wob .5s ease-in-out infinite alternate; display: inline-block; }
  @keyframes wob { from { transform: rotate(-8deg) scale(.95); } to { transform: rotate(8deg) scale(1.08); } }
  .top, .bot { color: #fff; font-size: clamp(20px, 2.5vw, 46px); line-height: 1.1; text-transform: uppercase;
               -webkit-text-stroke: 1.5px #000; text-shadow: 3px 3px 0 #000; }
  .bot { color: #ffe066; }
  .quote { margin-top: .8vh; font: 600 clamp(13px, 1.3vw, 24px) "Segoe UI", Arial, sans-serif; color: #b0bec5; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* Дима ржёт */
  .dima { flex: 0 0 auto; width: clamp(110px, 12vw, 210px); position: relative; animation: laugh .18s ease-in-out infinite alternate; }
  @keyframes laugh { from { transform: rotate(-6deg) translateY(0); } to { transform: rotate(6deg) translateY(-6px); } }
  .ha { position: absolute; left: 50%; top: -38%; transform: translateX(-50%); white-space: nowrap; color: #ff3b6b; font-size: clamp(20px, 2.4vw, 44px);
        -webkit-text-stroke: 1px #000; text-shadow: 3px 3px 0 #000; animation: haha .3s steps(2) infinite; }
  @keyframes haha { 50% { transform: translateX(-50%) scale(1.15) rotate(-4deg); } }

  /* Дима в квадрате слева */
  #box { position: fixed; left: 1.5vw; top: 50%; transform: translateY(-50%); width: clamp(200px, 22vw, 420px); aspect-ratio: 1; border: 4px solid #ffd54a; border-radius: 22px; overflow: hidden; box-shadow: 0 0 30px rgba(255,213,74,.35); background: #160a2a; }
  #box svg { width: 100%; height: 100%; display: block; }
  #prompt { position: fixed; left: 1.5vw; width: clamp(200px, 22vw, 420px); box-sizing: border-box; padding: 1.2vh 1vw; background: #fff; border: 3px solid #000; border-radius: 18px;
            font: 800 clamp(14px, 1.35vw, 26px) "Segoe UI", Arial, sans-serif; color: #111; opacity: 0; transition: opacity .3s, transform .3s; transform: translateY(10px); }
  #prompt.on { opacity: 1; transform: none; }
  #prompt b { color: #10a37f; font-family: Consolas, monospace; }
  #prompt::after { content: ""; position: absolute; left: 50%; bottom: -16px; border: 9px solid transparent; border-top-color: #000; transform: translateX(-50%); }

  /* статус (виден только в тест-режиме) */
  #status { position: fixed; top: 8px; left: 8px; font: 600 14px "Segoe UI", Arial; color: #fff; background: rgba(0,0,0,.6); padding: 4px 10px; border-radius: 8px; display: none; }
</style>
</head>
<body>

      <!-- очки с кодом -->
      <rect x="166" y="132" width="30" height="20" rx="6" fill="#000"/><rect x="204" y="132" width="30" height="20" rx="6" fill="#000"/>
      <g clip-path="url(#lens)"><g id="bxCode"></g></g>
      <rect x="166" y="132" width="30" height="20" rx="6" fill="none" stroke="#000" stroke-width="3"/><rect x="204" y="132" width="30" height="20" rx="6" fill="none" stroke="#000" stroke-width="3"/>

<script>
/* ======================= НАСТРОЙКИ ======================= */
const SHOW_MS     = 5200;  // сколько висит одна карточка
const FAST_MS     = 2800;  // если в очереди много сообщений — быстрее
const MAX_ON_SCREEN = 2;   // сколько карточек одновременно
const MAX_QUEUE   = 12;    // больше — старые выкидываем, чтобы не отставать от чата
const IGNORE = ["nightbot", "streamelements", "moobot", "fossabot", "wizebot", "streamlabs", "soundalerts", "sery_bot", "commanderroot"];
/* ========================================================= */

const params = new URLSearchParams(location.search);
const TEST = params.has("test");
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const status = txt => { if (TEST) { $("status").style.display = "block"; $("status").textContent = txt; } };

/* ---------- мемы про ник (связаны с нейронками) ---------- */
const MEMES = [
  ["🤖", "{n} спросил у нейронки", "как выключить нейронку"],
  ["📉", "{n} на бесплатном тарифе", "лимит кончился на слове «привет»"],
  ["💀", "{n} попросил GPT написать код", "GPT попросил {n} больше не писать"],
  ["🙅", "нейросеть про {n}:", "«извините, я не могу с этим помочь»"],
  ["🧠", "{n} — промпт-инженер", "промпт: «сделай красиво»"],
  ["🐋", "{n} поставил DeepSeek", "бесплатно, но обидно"],
  ["🫠", "GPT обучили на сообщениях {n}", "теперь он тоже пишет «ахах»"],
  ["🤡", "{n} думает, что умнее нейронки", "нейронка: 🙂 ок"],
  ["🪫", "у {n} 0 токенов", "и 100% уверенности"],
  ["🔍", "{n} загуглил вместо GPT", "в 2026 году. позор."],
  ["🔌", "нейросеть увидела аватарку {n}", "и ушла на перезагрузку"],
  ["⏳", "{n} ждёт сброса лимитов", "с 2023 года"],
  ["😭", "{n} спросил: «как стать Димоном?»", "GPT: никак ахахах"],
  ["🧩", "капча для {n}:", "докажите, что вы не нейронка"],
  ["🌀", "{n} написал в чат", "нейронка: галлюцинация подтверждена"],
  ["🆓", "у {n} free-тариф головного мозга", "обновитесь до PRO"],
  ["🥟", "{n} попросил рецепт пельменей", "GPT выдал 40 страниц кода"],
  ["🚽", "{n} оплатил подписку", "через бачок, как Дима учил"],
  ["🎓", "{n} сдал экзамен с GPT", "на «2», потому что спросил DeepSeek"],
  ["⚠️", "обнаружен {n}", "уровень PRO: 0 из 100"],
  ["🔥", "нейронка жарит токены", "а {n} жарит пельмени без PRO"],
  ["🤏", "мозг {n} — это нейросеть", "на 3 нейрона и 1 баг"],
  ["📵", "{n} сказал «я сам напишу»", "сервер упал от смеха"],
  ["🪦", "здесь покоится лимит {n}", "прожил 4 сообщения"],
];
let lastMeme = -1;
function pickMeme() { let i; do { i = Math.random() * MEMES.length | 0; } while (i === lastMeme && MEMES.length > 1); lastMeme = i; return MEMES[i]; }

/* ---------- Дима ржёт (SVG) ---------- */
const DIMA_SVG = `<svg viewBox="0 0 200 220" width="100%">
  <path d="M30 220 Q30 160 100 155 Q170 160 170 220 Z" fill="#3d7be0" stroke="#000" stroke-width="5"/>
  <circle cx="100" cy="95" r="72" fill="#f1c39b" stroke="#000" stroke-width="5"/>
  <path d="M30 90 Q22 18 100 20 Q178 18 170 90 Q156 52 100 56 Q48 52 30 90Z" fill="#3a2416" stroke="#000" stroke-width="4"/>
  <path d="M62 86 Q76 72 90 86 M110 86 Q124 72 138 86" stroke="#000" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M60 112 Q100 175 140 112 Z" fill="#5a0d0d" stroke="#000" stroke-width="5"/>
  <path d="M72 116 H128" stroke="#fff" stroke-width="9"/>
  <ellipse cx="100" cy="146" rx="20" ry="8" fill="#ff6b8a"/>
  <path d="M48 96 q-8 16 0 24 q8 -8 0 -24z M152 96 q-8 16 0 24 q8 -8 0 -24z" fill="#4fc3f7" stroke="#000" stroke-width="2"/>
</svg>`;
const HA = ["АХАХАХА", "АХАХАХАХА", "ХАХАХАХ", "АХАХ 😂", "ПХАХАХА"];

/* ---------- очередь и показ ---------- */
const queue = [];
let onScreen = 0;
function esc(s) { const d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function enqueue(nick, color, text) {
  if (IGNORE.includes(nick.toLowerCase())) return;
  queue.push({ nick, color, text });
  while (queue.length > MAX_QUEUE) queue.shift();
  pump();
}
function pump() {
  while (onScreen < MAX_ON_SCREEN && queue.length) showAlert(queue.shift());
}
async function showAlert({ nick, color, text }) {
  onScreen++;
  try {
    const [emo, top, bot] = pickMeme();
    const n = esc(nick);
    const safeColor = /^#[0-9a-f]{6}$/i.test(color) ? color : "#7dffb0";
    const el = document.createElement("div");
    el.className = "alert";
    el.innerHTML = `
      <div class="meme">
        <div class="nick" style="color:${safeColor}">${n}</div>
        <div class="top">${esc(top).split("{n}").join(n)}</div>
        <div class="emo">${emo}</div>
        <div class="bot">${esc(bot).split("{n}").join(n)}</div>
        ${text ? `<div class="quote">«${esc(text.slice(0, 90))}»</div>` : ""}
      </div>
      <div class="dima"><div class="ha">${HA[Math.random() * HA.length | 0]}</div>${DIMA_SVG}</div>`;
    $("stack").appendChild(el);
    await sleep(queue.length > 2 ? FAST_MS : SHOW_MS);
    el.classList.add("out");
    await sleep(450);
    el.remove();
  } finally {
    onScreen--;
    pump();
  }
}

/* ---------- чтение чата Twitch (анонимно, без токенов) ---------- */
let ws = null, channel = "", reconnectTimer = null;
function parseTags(raw) {
  const t = {};
  raw.split(";").forEach(kv => { const i = kv.indexOf("="); t[kv.slice(0, i)] = kv.slice(i + 1).replace(/\\s/g, " "); });
  return t;
}
function connect() {
  if (!channel) return;
  clearTimeout(reconnectTimer);
  if (ws) { ws.onclose = null; try { ws.close(); } catch (e) {} }
  ws = new WebSocket("wss://irc-ws.chat.twitch.tv:443");
  ws.onopen = () => {
    ws.send("CAP REQ :twitch.tv/tags");
    ws.send("NICK justinfan" + (10000 + Math.random() * 80000 | 0));
    ws.send("JOIN #" + channel);
    status("подключено к #" + channel);
  };
  ws.onmessage = ev => {
    String(ev.data).split("\r\n").forEach(line => {
      if (!line) return;
      if (line.startsWith("PING")) { ws.send("PONG :tmi.twitch.tv"); return; }
      const m = line.match(/^(?:@([^ ]+) )?:([^!]+)![^ ]+ PRIVMSG #[^ ]+ :(.*)$/);
      if (!m) return;
      const tags = m[1] ? parseTags(m[1]) : {};
      let text = m[3];
      if (text.startsWith("\u0001ACTION ")) text = text.slice(8, -1);
      enqueue(tags["display-name"] || m[2], tags.color || "", text);
    });
  };
  ws.onclose = () => { status("переподключение..."); reconnectTimer = setTimeout(connect, 3000); };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
}

// ник канала берётся из channel.txt — его можно поменять, ссылка останется той же
async function loadChannel() {
  try {
    const r = await fetch("channel.txt?nocache=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const c = (await r.text()).trim().toLowerCase().replace(/^#/, "");
    if (c && c !== channel) { channel = c; connect(); }
  } catch (e) {}
}
if (params.get("channel")) { channel = params.get("channel").toLowerCase(); connect(); } else { loadChannel(); setInterval(loadChannel, 30000); }

/* ---------- тест-режим: ?test — фейковые сообщения ---------- */
if (TEST) {
  const NICKS = ["джункспро", "тода_делитни", "сжумс", "годинкофдиф", "бейбаБибис", "Кунилка", "VasyaPupkin", "xX_NoLimits_Xx"];
  const MSGS = ["димон привет", "а когда стрим про gpt?", "ахахах", "у меня deepseek и что", "покажи пельмени", "PRO или не PRO"];
  const COLORS = ["#FF4500", "#1E90FF", "#9ACD32", "#FF69B4", "#DAA520", "#00FF7F", ""];
  setInterval(() => enqueue(NICKS[Math.random() * NICKS.length | 0], COLORS[Math.random() * COLORS.length | 0], MSGS[Math.random() * MSGS.length | 0]), 2500);
}

/* ---------- озвучка слов Димы ----------
   Сначала встроенный русский голос (speechSynthesis), если его нет — озвучка Google.
   В OBS у источника включите «Управлять звуком через OBS», чтобы звук шёл в стрим. */
const VOICE_ON = true;
let ruVoice = null;
function pickVoice() {
  try {
    const vs = (window.speechSynthesis && speechSynthesis.getVoices()) || [];
    const ru = vs.filter(v => /^ru/i.test(v.lang));
    ruVoice = ru.find(v => /dmitr|pavel|male|мужск|maxim|yuri/i.test(v.name)) || ru[0] || null;
  } catch (e) { ruVoice = null; }
}
try { pickVoice(); if (window.speechSynthesis) speechSynthesis.onvoiceschanged = pickVoice; } catch (e) {}
function sayAloud(text) {
  if (!VOICE_ON) return;
  const clean = String(text).replace(/[^\p{L}\p{N}\s,.!?:-]/gu, " ").replace(/\s+/g, " ").trim();
  if (!clean) return;
  try {
    if (ruVoice) {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(clean);
      u.voice = ruVoice; u.lang = "ru-RU"; u.rate = 1.05; u.pitch = 0.9; u.volume = 1;
      speechSynthesis.speak(u);
      return;
    }
  } catch (e) {}
  try {
    const a = new Audio("https://translate.google.com/translate_tts?ie=UTF-8&tl=ru&client=tw-ob&q=" + encodeURIComponent(clean));
    a.volume = 1; a.play().catch(() => {});
  } catch (e) {}
}

/* ---------- Дима в квадрате: ест пельмени, пишет промты, раз в минуту танцует ---------- */
const PROMPT_EVERY_MS = 20000;  // промт раз в 20 сек
const DANCE_EVERY_MS  = 60000;  // раз в минуту встаёт танцевать
const DANCE_MS        = 18000;  // сколько танцует
const PROMPTS = ["сделай круче", "ещё круче", "ну чё, готов?", "а теперь в 10 раз круче", "добавь больше PRO", "перепиши, но чтобы я не понял",
  "сделай мне бизнес на миллион, быстро", "объясни как пятилетнему, но я PRO", "сгенерируй пельмени", "сделай красиво. нет, ещё красивее",
  "добавь неона и токенов", "а можно без багов?", "теперь как будто это 2077", "напиши код, который пишет код", "сделай, чтобы DeepSeek заплакал",
  "ну чё, где результат?", "давай ещё раз, но с душой", "сделай хайп", "больше огня 🔥", "покороче. нет, подлиннее", "оптимизируй мою жизнь",
  "сделай мне подписчиков", "а если ещё подумать?", "ну давай, ты же PRO", "сделай мем про чат", "сократи лимиты всем, кроме меня",
  "переведи на язык успеха", "сделай круче, чем вчера", "ты точно стараешься?", "сделай так, чтобы чат офигел", "добавь мне харизмы", "а можно в 4K?"];
let promptBag = [];
function nextPrompt() {
  if (!promptBag.length) { promptBag = [...PROMPTS]; for (let i = promptBag.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [promptBag[i], promptBag[j]] = [promptBag[j], promptBag[i]]; } }
  return promptBag.shift();
}
(() => {
  const lerpN = (a, b, k) => a + (b - a) * k;
  // гирлянда и код в очках
  const C = ["#ff3b3b", "#ffd54a", "#4dfcff", "#ff4fd8", "#7dffb0"];
  $("bxLights").innerHTML = Array.from({ length: 14 }, (_, i) => { const row = i % 4, y = 170 + row * 30, h = 18 + row * 16; return `<circle class="bxl" cx="${(i * 23) % (h * 2) - h}" cy="${y}" r="5" fill="${C[i % 5]}"/>`; }).join("");
  const ch = "01GPTPRO{}<>#$";
  $("bxCode").innerHTML = Array.from({ length: 16 }, (_, r) => `<text x="164" y="${r * 7}" font-size="7" font-family="Consolas, monospace" fill="${r % 4 ? "#00ff66" : "#b6ffcc"}">${Array.from({ length: 16 }, () => ch[Math.random() * ch.length | 0]).join("")}</text>`).join("");
  $("bxScreen").insertAdjacentHTML("afterend", Array.from({ length: 5 }, (_, i) => `<rect class="bxSl" x="300" y="${236 + i * 9}" height="4" fill="#00ff66" opacity=".7"/>`).join(""));
  const pels = [...$("bxPel").children];
  const lights = [...document.querySelectorAll(".bxl")], screenLines = [...document.querySelectorAll(".bxSl")];
  const st = $("bxStand"), sit = $("bxSit");
  const q = s => st.querySelector(s);
  const t0 = performance.now();
  (function frame(now) {
    const t = Math.max(0, now - t0);
    lights.forEach((l, i) => l.setAttribute("opacity", (i + (t / 300 | 0)) % 3 ? 1 : .25));
    $("bxCode").setAttribute("transform", `translate(0,${132 - 56 + ((t / 25) % 56)})`);
    screenLines.forEach((l, i) => l.setAttribute("width", 20 + Math.abs(Math.sin(t / 300 + i)) * 55));
    // цикл минуты: сидит → отходит → танцует → возвращается
    const c = t % DANCE_EVERY_MS, D0 = DANCE_EVERY_MS - DANCE_MS - 2000, WALK = 1000;
    const dancing = c >= D0;
    sit.setAttribute("display", dancing ? "none" : "inline");
    st.setAttribute("display", dancing ? "inline" : "none");
    $("bxChair").setAttribute("display", "inline");
    $("bxDanceTxt").setAttribute("opacity", dancing && c > D0 + WALK && c < DANCE_EVERY_MS - WALK ? 1 : 0);
    if (!dancing) {
      // ест пельмени
      const ph = (t % 1600) / 1600, up = Math.sin(ph * Math.PI);
      const fx = lerpN(236, 204, up), fy = lerpN(292, 168, up);
      $("bxArm").setAttribute("d", `M236 214 Q${lerpN(262, 240, up)} ${lerpN(270, 220, up)} ${fx} ${fy + 4}`);
      $("bxFork").setAttribute("transform", `translate(${fx},${fy}) rotate(${lerpN(10, -30, up)})`);
      $("bxMouth").setAttribute("ry", ph > .5 ? 2 + Math.abs(Math.sin(t / 70)) * 4 : (up > .9 ? 7 : 3));
      pels.forEach((p, i) => p.setAttribute("display", i >= (Math.floor(t / 1600) % 4) ? "inline" : "none"));
    } else {
      // встал, отошёл вглубь, танцует скибиди
      const k = c - D0, back = DANCE_EVERY_MS - c;
      const walkK = Math.min(1, k / WALK, back / WALK);
      const x = lerpN(200, 300, walkK), scale = lerpN(1, .78, walkK), baseY = lerpN(300, 270, walkK);
      const groove = walkK >= 1, b = groove ? Math.abs(Math.sin(t / 140)) : 0, sw = Math.sin(t / 140);
      st.setAttribute("transform", `translate(${x + (groove ? sw * 10 : 0)},${baseY - b * 12}) scale(${scale})`);
      q(".sHead").setAttribute("transform", groove ? `translate(${sw * 10},0) rotate(${sw * 14},0,-228)` : "");
      q(".sArmL").setAttribute("transform", `translate(-34,-182) rotate(${groove ? 140 + Math.sin(t / 90) * 40 : Math.sin(t / 120) * 25})`);
      q(".sArmR").setAttribute("transform", `translate(34,-182) rotate(${groove ? -60 + Math.cos(t / 90) * 50 : -Math.sin(t / 120) * 25})`);
      q(".sLegL").setAttribute("transform", `rotate(${groove ? Math.max(0, sw) * 30 : Math.sin(t / 120) * 20},-13,-80)`);
      q(".sLegR").setAttribute("transform", `rotate(${groove ? Math.min(0, sw) * 30 : -Math.sin(t / 120) * 20},13,-80)`);
    }
    requestAnimationFrame(frame);
  })(t0);
  // промты раз в 20 сек (во время танца — свои реплики)
  const DANCE_LINES = ["скибиди-доп-доп 🕺", "GPT, включи бит!", "это мой PRO-дэнс", "чат, повторяем!"];
  async function speak() {
    const c = (performance.now() - t0) % DANCE_EVERY_MS, dancing = c >= DANCE_EVERY_MS - DANCE_MS - 2000;
    const box = $("box").getBoundingClientRect(), p = $("prompt");
    const line = dancing ? DANCE_LINES[Math.random() * DANCE_LINES.length | 0] : nextPrompt();
    p.innerHTML = dancing ? esc(line) : `<b>&gt; GPT:</b> ${esc(line)}`;
    sayAloud(line);
    p.style.top = "0px"; p.classList.add("on");
    p.style.top = Math.max(8, box.top - p.offsetHeight - 22) + "px";
    await sleep(6000);
    p.classList.remove("on");
  }
  setTimeout(() => { speak(); setInterval(speak, PROMPT_EVERY_MS); }, 3000);
})();

/* ---------- автообновление: новая версия подхватывается сама, ссылка в OBS та же ---------- */
let myVersion = null;
async function checkUpdate() {
  try {
    const r = await fetch("version.txt?nocache=" + Date.now(), { cache: "no-store" });
    if (!r.ok) return;
    const v = (await r.text()).trim();
    if (myVersion === null) { myVersion = v; return; }
    if (v !== myVersion) {
      const keep = new URLSearchParams(location.search); keep.set("v", v);
      location.replace(location.pathname + "?" + keep.toString());
    }
  } catch (e) {}
}
checkUpdate();
setInterval(checkUpdate, 10000);
</script>
